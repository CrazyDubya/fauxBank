name = "fauxbank"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# D1 Database for ledger
[[d1_databases]]
binding = "DB"
database_name = "fauxbank-db"
database_id = "fauxbank-db-local"
migrations_dir = "migrations"

# KV for session cache
[[kv_namespaces]]
binding = "SESSIONS"
id = "fauxbank-sessions"

# Durable Objects for account state
[[durable_objects.bindings]]
name = "ACCOUNT_LEDGER"
class_name = "AccountLedger"

[[migrations]]
tag = "v1"
new_classes = ["AccountLedger"]

# Environment variables
[vars]
ENVIRONMENT = "development"
MAX_SINGLE_TRANSACTION = "10000000"
MAX_DAILY_AGGREGATE = "100000000"

# Rate limiting configuration
[vars.rate_limits]
requests_per_second = "10"
requests_per_minute = "100"
transactions_per_minute = "50"
